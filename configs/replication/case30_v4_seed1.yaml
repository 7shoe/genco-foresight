    standardize_features_on_train: true
    lags_hours:
    - 1
    - 2
    - 24
    - 48
    observed_covariates:
    - pd_mw
    - qd_mvar
    - vm
    - va_rad
    - bus_pg_mw
    - bus_qg_mvar
    calendar:
    - hour_sin
    - hour_cos
    - dow_sin
    - dow_cos
    - weekend
