[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-fm-foresight"
version = "0.3.1"
description = "Probabilistic power-system forecasts with a frozen GENCO model"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy", "pandas", "PyYAML", "scipy", "matplotlib", "huggingface_hub", "pyarrow",
  "OmegaConf>=2.3,<2.4", "gridfm-datakit==1.1.0", "matpowercaseframes", "requests",
]

[project.scripts]
pff = "power_fm_foresight.cli:main"
power-fm-foresight = "power_fm_foresight.cli:main"

[project.optional-dependencies]
cuda = []
xpu = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["power_fm_foresight*"]

[tool.setuptools.package-data]
power_fm_foresight = ["resources/*.yaml", "resources/protocols/*.json", "resources/julia/*", "resources/networks/*"]
